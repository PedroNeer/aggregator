name: Aggregate candidate subscription

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: aggregate-candidate-subscription
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Aggregate recent Gist revisions
        env:
          SOURCE_GIST_ID: ${{ vars.SOURCE_GIST_ID }}
          SOURCE_FILENAME: ${{ vars.SOURCE_FILENAME }}
          TARGET_GIST_ID: ${{ vars.TARGET_GIST_ID }}
          OUTPUT_FILENAME: ${{ vars.OUTPUT_FILENAME || 'candidate.yaml' }}
          METADATA_FILENAME: ${{ vars.METADATA_FILENAME || 'candidate-meta.json' }}
          RETENTION_HOURS: ${{ vars.RETENTION_HOURS || '24' }}
          MAX_REVISIONS: ${{ vars.MAX_REVISIONS || '30' }}
          MIN_PROXIES: ${{ vars.MIN_PROXIES || '20' }}
          MAX_PROXIES: ${{ vars.MAX_PROXIES || '0' }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python aggregate_gist_candidates.py
